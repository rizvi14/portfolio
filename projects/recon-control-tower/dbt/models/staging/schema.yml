version: 2

models:
  - name: stg_internal_ledger
    description: Canonicalised ledger entries. Sign convention applied here and nowhere else.
    columns:
      - name: ledger_entry_id
        data_tests: [unique, not_null]
      - name: flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["ach", "card", "wire"]
      - name: direction
        data_tests:
          - accepted_values:
              arguments:
                values: ["credit", "debit"]
      - name: signed_amount_cents
        data_tests: [not_null]
      - name: gl_account_code
        data_tests:
          - relationships:
              arguments:
                to: ref('seed_gl_account_map')
                field: gl_account_code

  - name: stg_partner_bank_statement
    description: Bank statement lines with references and counterparties parsed out of free text.
    columns:
      - name: bank_txn_id
        data_tests: [unique, not_null]
      - name: amount_signed_cents
        data_tests: [not_null]
      - name: flow_type
        data_tests:
          - accepted_values:
              arguments:
                values: ["ach", "wire"]

  - name: stg_card_processor_settlement
    columns:
      - name: processor_txn_id
        data_tests: [unique, not_null]
      - name: signed_amount_cents
        data_tests: [not_null]

  - name: stg_fx_rates
    data_tests:
      - unique_combination:
          arguments:
            combination: [rate_date, currency]
